name: nelsontan_offshore_drilling
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^8.0.1
  http: ^1.2.2
  image_picker: ^1.2.0
  video_player: ^2.8.2
  audioplayers: ^6.1.0
  speech_to_text: ^7.3.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  uuid: ^4.3.3
  path_provider: ^2.1.3




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  intl: ^0.20.2
  hive_generator: ^2.0.1
  build_runner: ^2.4.9


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon/icon_foreground.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/app_icon/
    - assets/thumbnails/
    - assets/icons/navigation/
    - assets/audio/correct.mp3
    - assets/audio/wrong.mp3